# BitMagnet · 自托管种子索引 / DHT 爬虫 / Torznab 接口
# 用法： cp .env.example .env && ./deploy.sh
# 起来后打开 http://<本机IP>:3333 （Web UI / GraphQL / Torznab 同源）
#
# 说明：
# - 仅依赖 PostgreSQL（官方 minimal 配置），不含 redis / gluetun，匹配轻量部署。
# - 镜像以各自默认用户运行（postgres 镜像内部 postgres 用户 / bitmagnet 以 root 写 /root/.config），
#   故不引入 PUID/PGID（那是 linuxserver 镜像的概念，此处不适用）。
# - 数据均落 ${DATA_DIR}（默认 ./data），干净卸载 = docker compose down -v。
# - 本工程为通用公开模板，不含任何环境专属网络 hack。

name: bitmagnet

services:
  postgres:
    image: postgres:16-alpine
    container_name: bitmagnet-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bitmagnet}
      - POSTGRES_DB=bitmagnet
      - PGUSER=postgres
    shm_size: 1g
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    container_name: bitmagnet
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bitmagnet}
      - POSTGRES_DB=bitmagnet
      # TMDB 元数据 enrichment：默认关闭（无需外网 TMDB，开箱即索引）；
      # 填了 TMDB_API_KEY 时请改为 true 以启用海报/年份/类型匹配。
      - TMDB_ENABLED=${TMDB_ENABLED:-false}
      # 可选：TMDB API Key 开启影视元数据 enrichment
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # 出网代理：容器无直连外网（api.themoviedb.org 只解析出 IPv6，容器无 IPv6 路由），
      # bitmagnet 也没有专用的 proxy 配置项，故依赖 Go 标准库对 HTTP(S)_PROXY 的支持。
      # 已实测：容器内经 squid 访问 http://api.themoviedb.org → 401（= 请求确实到达 TMDB）。
      - HTTP_PROXY=${TMDB_PROXY:-}
      - HTTPS_PROXY=${TMDB_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,postgres,172.18.0.0/16,192.168.68.0/24
    ports:
      - "${WEB_PORT:-3333}:3333"   # Web UI / GraphQL API / Torznab 同源
      - "3334:3334/tcp"            # DHT（TCP）
      - "3334:3334/udp"            # DHT（UDP）
    volumes:
      - ${DATA_DIR:-./data}/config:/root/.config/bitmagnet
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 管理面板 bitmagnet-bot（一键搜索/发种、系统状态、TMDB 配置、Clash 出网自愈）
  # 零 Python 外部依赖；配置保存经 docker.sock 触发 `docker compose up -d` 重建容器。
  # 挂载项目 .env 与 docker-compose.yml，使其改写 TMDB 配置后能自动重建 bitmagnet 服务。
  # ---------------------------------------------------------------------------
  bitmagnet-bot:
    build: ./manager
    container_name: bitmagnet-bot
    restart: unless-stopped
    ports:
      - "${BOT_PORT:-8790}:8790"
    environment:
      - PORT=8790
      - BITMAGNET_HOST=http://bitmagnet:3333
      # 配置页可改写项（与 bitmagnet 服务共用项目 .env，改写后自动重建）
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_ENABLED=${TMDB_ENABLED:-false}
      - TMDB_PROXY=${TMDB_PROXY:-}
      # 可选：qBittorrent 一键下载（留空则不启用）
      - QBITTORRENT_URL=${QBITTORRENT_URL:-}
      - QBITTORRENT_USER=${QBITTORRENT_USER:-}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-}
      - QBITTORRENT_CATEGORY=${QBITTORRENT_CATEGORY:-bitmagnet}
      # 可选：Clash/OpenClash 出网自愈（环境专属，按需开启）
      - CLASH_API_URL=${CLASH_API_URL:-}
      - CLASH_API_TOKEN=${CLASH_API_TOKEN:-}
      - CLASH_PROXY=${CLASH_PROXY:-}
      # 容器内挂载路径（见 volumes）
      - BITMAGNET_ENV_FILE=/host/bitmagnet/.env
      - BITMAGNET_COMPOSE_FILE=/host/bitmagnet/docker-compose.yml
      # 面板展示用（浏览器可点开、免登）；不参与容器内部调用
      - PUBLIC_BITMAGNET_URL=${PUBLIC_BITMAGNET_URL:-}
      - PUBLIC_QBITTORRENT_URL=${PUBLIC_QBITTORRENT_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/host/bitmagnet/.env
      - ./docker-compose.yml:/host/bitmagnet/docker-compose.yml:ro
      # 代码热重载：改 manager/app.py 后 restart 容器即生效，无需重新 build 镜像
      # （build 需 curl download.docker.com / github.com，NAS 直连被墙）
      - ./manager/app.py:/app/app.py:ro
    depends_on:
      bitmagnet:
        condition: service_started
